name: cortex ai deployment

on:
    push:
        branches:
            - main

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: aws configure
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              id: ecr
              uses: aws-actions/amazon-ecr-login@v2
              with:
                  region: ${{ env.AWS_REGION }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # ---------- gateway ----------
            - name: build & push gateway
              run: |
                  docker buildx build \
                    --platform linux/arm64 \
                    -f backend/gateway/Dockerfile \
                    -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest \
                    --push \
                    backend

            # ---------- auth ----------
            - name: write firebase service account key
              run: |
                echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > backend/services/auth/serviceAccountKey.json
            - name: build & push auth
              run: |
                  docker buildx build \
                    --platform linux/arm64 \
                    -f backend/services/auth/Dockerfile \
                    -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest \
                    --push \
                    backend

            # ---------- chat ----------
            - name: build & push chat
              run: |
                  docker buildx build \
                    --platform linux/arm64 \
                    -f backend/services/chat/Dockerfile \
                    -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest \
                    --push \
                    backend

            # ---------- agent ----------
            - name: build & push agent
              run: |
                  docker buildx build \
                    --platform linux/arm64 \
                    -f backend/services/agent/Dockerfile \
                    -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest \
                    --push \
                    backend

            # ---------- billing ----------
            - name: build & push billing
              run: |
                  docker buildx build \
                    --platform linux/arm64 \
                    -f backend/services/billing/Dockerfile \
                    -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest \
                    --push \
                    backend

            # ---------- deploys ----------
            - name: deploy gateway
              run: |
                  aws ecs update-service \
                    --cluster ${{ secrets.ECS_CLUSTER }} \
                    --service ${{ secrets.GATEWAY_SERVICE }} \
                    --force-new-deployment

            - name: deploy auth
              run: |
                  aws ecs update-service \
                    --cluster ${{ secrets.ECS_CLUSTER }} \
                    --service ${{ secrets.AUTH_SERVICE }} \
                    --force-new-deployment

            - name: deploy agent
              run: |
                  aws ecs update-service \
                    --cluster ${{ secrets.ECS_CLUSTER }} \
                    --service ${{ secrets.AGENT_SERVICE }} \
                    --force-new-deployment

            - name: deploy chat
              run: |
                  aws ecs update-service \
                    --cluster ${{ secrets.ECS_CLUSTER }} \
                    --service ${{ secrets.CHAT_SERVICE }} \
                    --force-new-deployment

            - name: deploy billing
              run: |
                  aws ecs update-service \
                    --cluster ${{ secrets.ECS_CLUSTER }} \
                    --service ${{ secrets.BILLING_SERVICE }} \
                    --force-new-deployment

    deploy-frontend:
        needs: deploy-backend
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: build frontend
              run: |
                  cd frontend
                  npm install
                  npm run build

            - name: aws configure
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: upload dist to S3
              run: |
                  aws s3 sync \
                    frontend/dist \
                    s3://${{ secrets.S3_BUCKET }} \
                    --delete

            - name: invalidate cloudfront
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"


